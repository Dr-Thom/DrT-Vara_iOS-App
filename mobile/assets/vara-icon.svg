<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <!-- Rounded square background - Deep Professional Blue -->
    <rect width="512" height="512" rx="115" fill="#1E40AF"/>
    
    <!-- Shield shape - Trust & Security -->
    <path d="M 256 80 L 360 120 L 360 220 Q 360 300 256 380 Q 152 300 152 220 L 152 120 Z" 
          fill="#3B82F6" stroke="#DBEAFE" stroke-width="4"/>
    
    <!-- Inner shield highlight for depth -->
    <path d="M 256 100 L 340 130 L 340 220 Q 340 280 256 350 Q 172 280 172 220 L 172 130 Z" 
          fill="#60A5FA" opacity="0.3"/>
    
    <!-- Letter V - VARA Brand -->
    <text x="256" y="260" 
          font-family="Arial, sans-serif" 
          font-size="140" 
          font-weight="bold" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          dominant-baseline="middle">V</text>
    
    <!-- Upward arrow - Growth & Earnings -->
    <g transform="translate(256, 420)">
        <!-- Arrow shaft -->
        <rect x="-8" y="-30" width="16" height="50" fill="#10B981" rx="4"/>
        
        <!-- Arrow head -->
        <path d="M -25 -25 L 0 -50 L 25 -25 Z" fill="#10B981"/>
    </g>
    
    <!-- VARA text -->
    <text x="256" y="480" 
          font-family="Arial, sans-serif" 
          font-size="32" 
          font-weight="600" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          opacity="0.9">VARA</text>
</svg>
