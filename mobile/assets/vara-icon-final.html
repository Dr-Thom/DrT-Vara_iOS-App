<!DOCTYPE html>
<html>
<head>
    <title>VARA: USD App Icon - ADA Compliant</title>
</head>
<body style="margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0;">
    
    <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <!-- Rounded square background -->
        <rect width="512" height="512" rx="115" fill="#1E3A8A"/>
        
        <!-- FBI-style Badge Shield -->
        <path d="M 256 70 
                 L 380 100 
                 L 390 240 
                 Q 390 310 256 400 
                 Q 122 310 122 240 
                 L 132 100 Z" 
              fill="#2563EB" 
              stroke="#F59E0B" 
              stroke-width="6"/>
        
        <!-- Inner badge border -->
        <path d="M 256 85 
                 L 370 112 
                 L 378 240 
                 Q 378 300 256 380 
                 Q 134 300 134 240 
                 L 142 112 Z" 
              fill="#3B82F6" 
              stroke="#FCD34D" 
              stroke-width="3"/>
        
        <!-- Badge ribbon at top -->
        <path d="M 160 130 
                 Q 160 115 175 115 
                 L 337 115 
                 Q 352 115 352 130 
                 L 350 155 
                 Q 350 165 340 165 
                 L 172 165 
                 Q 162 165 162 155 Z" 
              fill="#1E40AF" 
              stroke="#FCD34D" 
              stroke-width="2"/>
        
        <!-- 3 EQUAL STARS -->
        <g fill="#FCD34D" stroke="#F59E0B" stroke-width="1.5">
            <path d="M 195 195 l 8 24 h 25 l -20 15 8 24 -21 -16 -21 16 8 -24 -20 -15 h 25 z"/>
            <path d="M 256 195 l 8 24 h 25 l -20 15 8 24 -21 -16 -21 16 8 -24 -20 -15 h 25 z"/>
            <path d="M 317 195 l 8 24 h 25 l -20 15 8 24 -21 -16 -21 16 8 -24 -20 -15 h 25 z"/>
        </g>
        
        <!-- Letter V -->
        <text x="256" y="290" 
              font-family="'Arial Black', Arial, sans-serif" 
              font-size="150" 
              font-weight="900" 
              fill="#FFFFFF" 
              text-anchor="middle" 
              dominant-baseline="middle"
              stroke="#1E40AF"
              stroke-width="3">V</text>
        
        <!-- THICKER Stock Market Arrow with LEGIBLE USD -->
        <g transform="translate(145, 430)">
            <!-- White background box for USD text (ADA contrast) -->
            <rect x="-5" y="20" width="55" height="32" rx="4" 
                  fill="#FFFFFF" 
                  stroke="#10B981" 
                  stroke-width="2"/>
            
            <!-- "USD" text - LARGER, BOLD, HIGH CONTRAST -->
            <text x="22" y="42" 
                  font-family="'Arial Black', Arial, sans-serif" 
                  font-size="26" 
                  font-weight="900" 
                  fill="#10B981" 
                  text-anchor="middle"
                  dominant-baseline="middle">USD</text>
            
            <!-- Chart line (THICKER) -->
            <path d="M 25 35 
                     L 50 25 
                     L 75 30 
                     L 100 15 
                     L 125 10 
                     L 150 -5" 
                  stroke="#10B981" 
                  stroke-width="11" 
                  fill="none"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
            
            <!-- Arrow (THICKER) -->
            <g transform="translate(150, -5)">
                <line x1="0" y1="0" x2="40" y2="-40" 
                      stroke="#10B981" 
                      stroke-width="13" 
                      stroke-linecap="round"/>
                <path d="M 40 -40 L 25 -30 M 40 -40 L 30 -25" 
                      stroke="#10B981" 
                      stroke-width="13" 
                      stroke-linecap="round"/>
                <circle cx="40" cy="-40" r="6" fill="#10B981"/>
            </g>
        </g>
        
        <!-- "VARA: USD" text on ribbon -->
        <text x="256" y="143" 
              font-family="Arial, sans-serif" 
              font-size="22" 
              font-weight="bold" 
              fill="#FCD34D" 
              text-anchor="middle" 
              dominant-baseline="middle"
              letter-spacing="0.5">VARA: USD</text>
        
        <!-- Bottom text -->
        <text x="256" y="485" 
              font-family="Arial, sans-serif" 
              font-size="26" 
              font-weight="700" 
              fill="#E5E7EB" 
              text-anchor="middle" 
              letter-spacing="1.5">CERTIFIED</text>
    </svg>

</body>
</html>
