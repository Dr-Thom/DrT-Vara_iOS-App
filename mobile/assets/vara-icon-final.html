<!DOCTYPE html>
<html>
<head>
    <title>VARA App Icon - 3 Stars + Bigger Arrow</title>
</head>
<body style="margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0;">
    
    <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <!-- Rounded square background -->
        <rect width="512" height="512" rx="115" fill="#1E3A8A"/>
        
        <!-- FBI-style Badge Shield -->
        <path d="M 256 70 
                 L 380 100 
                 L 390 240 
                 Q 390 310 256 400 
                 Q 122 310 122 240 
                 L 132 100 Z" 
              fill="#2563EB" 
              stroke="#F59E0B" 
              stroke-width="6"/>
        
        <!-- Inner badge border -->
        <path d="M 256 85 
                 L 370 112 
                 L 378 240 
                 Q 378 300 256 380 
                 Q 134 300 134 240 
                 L 142 112 Z" 
              fill="#3B82F6" 
              stroke="#FCD34D" 
              stroke-width="3"/>
        
        <!-- Badge ribbon at top -->
        <path d="M 170 130 
                 Q 170 115 185 115 
                 L 327 115 
                 Q 342 115 342 130 
                 L 340 155 
                 Q 340 165 330 165 
                 L 182 165 
                 Q 172 165 172 155 Z" 
              fill="#1E40AF" 
              stroke="#FCD34D" 
              stroke-width="2"/>
        
        <!-- 3 STARS OVER SHIELD (arc formation above V) -->
        <!-- Representing: Make USD, Easy/Fast, Easy Withdrawals -->
        <g fill="#FCD34D" stroke="#F59E0B" stroke-width="1.5">
            <!-- Left Star - Easy & Fast -->
            <path d="M 180 200 l 8 24 h 25 l -20 15 8 24 -21 -16 -21 16 8 -24 -20 -15 h 25 z" 
                  transform="scale(0.9)"/>
            
            <!-- Center Star - Make USD (bigger, emphasized) -->
            <path d="M 256 175 l 10 30 h 32 l -26 19 10 30 -26 -20 -26 20 10 -30 -26 -19 h 32 z" 
                  transform="scale(1.0)"
                  filter="drop-shadow(0 0 3px #F59E0B)"/>
            
            <!-- Right Star - Easy Withdrawals -->
            <path d="M 332 200 l 8 24 h 25 l -20 15 8 24 -21 -16 -21 16 8 -24 -20 -15 h 25 z" 
                  transform="scale(0.9)"/>
        </g>
        
        <!-- Letter V (bold) -->
        <text x="256" y="280" 
              font-family="'Arial Black', Arial, sans-serif" 
              font-size="150" 
              font-weight="900" 
              fill="#FFFFFF" 
              text-anchor="middle" 
              dominant-baseline="middle"
              stroke="#1E40AF"
              stroke-width="3">V</text>
        
        <!-- BIGGER LONGER Stock Market Arrow -->
        <g transform="translate(180, 430)">
            <!-- Longer chart line (upward trend) -->
            <path d="M 0 35 
                     L 25 25 
                     L 50 30 
                     L 75 15 
                     L 100 10 
                     L 125 -5" 
                  stroke="#10B981" 
                  stroke-width="7" 
                  fill="none"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
            
            <!-- Bigger arrow pointing up-right -->
            <g transform="translate(125, -5)">
                <!-- Arrow shaft (longer) -->
                <line x1="0" y1="0" x2="40" y2="-40" 
                      stroke="#10B981" 
                      stroke-width="10" 
                      stroke-linecap="round"/>
                
                <!-- Arrow head (bigger) -->
                <path d="M 40 -40 L 25 -32 M 40 -40 L 32 -25" 
                      stroke="#10B981" 
                      stroke-width="10" 
                      stroke-linecap="round"/>
                
                <!-- Dot at arrow tip -->
                <circle cx="40" cy="-40" r="5" fill="#10B981"/>
            </g>
        </g>
        
        <!-- "VARA" text on ribbon -->
        <text x="256" y="143" 
              font-family="Arial, sans-serif" 
              font-size="24" 
              font-weight="bold" 
              fill="#FCD34D" 
              text-anchor="middle" 
              dominant-baseline="middle">VARA</text>
        
        <!-- Bottom text -->
        <text x="256" y="485" 
              font-family="Arial, sans-serif" 
              font-size="26" 
              font-weight="700" 
              fill="#E5E7EB" 
              text-anchor="middle" 
              letter-spacing="1.5">CERTIFIED</text>
    </svg>

</body>
</html>
