<!DOCTYPE html>
<html>
<head>
    <title>VARA App Icon - Professional Badge Style</title>
</head>
<body style="margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0;">
    
    <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <!-- Rounded square background -->
        <rect width="512" height="512" rx="115" fill="#1E3A8A"/>
        
        <!-- FBI-style Badge Shield (Pentagon shape with details) -->
        <!-- Outer badge border -->
        <path d="M 256 70 
                 L 380 100 
                 L 390 240 
                 Q 390 310 256 400 
                 Q 122 310 122 240 
                 L 132 100 Z" 
              fill="#2563EB" 
              stroke="#F59E0B" 
              stroke-width="6"/>
        
        <!-- Inner badge border (gold trim) -->
        <path d="M 256 85 
                 L 370 112 
                 L 378 240 
                 Q 378 300 256 380 
                 Q 134 300 134 240 
                 L 142 112 Z" 
              fill="#3B82F6" 
              stroke="#FCD34D" 
              stroke-width="3"/>
        
        <!-- Badge ribbon/band at top -->
        <path d="M 170 130 
                 Q 170 115 185 115 
                 L 327 115 
                 Q 342 115 342 130 
                 L 340 155 
                 Q 340 165 330 165 
                 L 182 165 
                 Q 172 165 172 155 Z" 
              fill="#1E40AF" 
              stroke="#FCD34D" 
              stroke-width="2"/>
        
        <!-- Decorative stars (badge detail) -->
        <g fill="#FCD34D">
            <!-- Left star -->
            <path d="M 160 200 l 6 18 h 19 l -15 11 6 18 -16 -12 -16 12 6 -18 -15 -11 h 19 z" 
                  transform="scale(0.7)"/>
            <!-- Right star -->
            <path d="M 340 200 l 6 18 h 19 l -15 11 6 18 -16 -12 -16 12 6 -18 -15 -11 h 19 z" 
                  transform="scale(0.7)"/>
        </g>
        
        <!-- Letter V (bold, official) -->
        <text x="256" y="260" 
              font-family="'Arial Black', Arial, sans-serif" 
              font-size="150" 
              font-weight="900" 
              fill="#FFFFFF" 
              text-anchor="middle" 
              dominant-baseline="middle"
              stroke="#1E40AF"
              stroke-width="3">V</text>
        
        <!-- Stock market upward trend arrow -->
        <g transform="translate(256, 415)">
            <!-- Chart line (zigzag upward trend) -->
            <path d="M -45 20 L -25 10 L -5 15 L 15 -5 L 35 -15" 
                  stroke="#10B981" 
                  stroke-width="5" 
                  fill="none"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
            
            <!-- Arrow pointing up-right (stock trend) -->
            <g transform="translate(35, -15)">
                <!-- Arrow shaft -->
                <line x1="0" y1="0" x2="25" y2="-25" 
                      stroke="#10B981" 
                      stroke-width="8" 
                      stroke-linecap="round"/>
                <!-- Arrow head -->
                <path d="M 25 -25 L 15 -20 M 25 -25 L 20 -15" 
                      stroke="#10B981" 
                      stroke-width="8" 
                      stroke-linecap="round"/>
                <!-- Small dot at arrow end -->
                <circle cx="25" cy="-25" r="4" fill="#10B981"/>
            </g>
        </g>
        
        <!-- "VARA" text on ribbon -->
        <text x="256" y="143" 
              font-family="Arial, sans-serif" 
              font-size="24" 
              font-weight="bold" 
              fill="#FCD34D" 
              text-anchor="middle" 
              dominant-baseline="middle">VARA</text>
        
        <!-- Bottom text -->
        <text x="256" y="480" 
              font-family="Arial, sans-serif" 
              font-size="28" 
              font-weight="700" 
              fill="#E5E7EB" 
              text-anchor="middle" 
              letter-spacing="2">CERTIFIED</text>
    </svg>

</body>
</html>
